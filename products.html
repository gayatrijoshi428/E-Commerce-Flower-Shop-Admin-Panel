<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Florian Florist</title>

    <link rel="stylesheet" href="style.css">

    <!-- BOOTSTRAP ICONS -->

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo-section">

            <img src="logo.png" class="logo">

            <h2>Florian Florist</h2>

        </div>

        <div class="nav-icons">

            <i class="bi bi-search"></i>

            <i class="bi bi-bell"></i>

            <i class="bi bi-person-circle"></i>

        </div>

    </nav>

    <!-- DASHBOARD -->

    <div class="dashboard">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <a href="index.html">
                <i class="bi bi-grid-fill"></i>
                Dashboard
            </a>

            <a href="products.html" class="active">
                <i class="bi bi-flower1"></i>
                Products
            </a>

            <a href="#">
                <i class="bi bi-bag-fill"></i>
                Orders
            </a>

            <a href="#">
                <i class="bi bi-people-fill"></i>
                Customers
            </a>

            <a href="#">
                <i class="bi bi-credit-card-fill"></i>
                Payments
            </a>

            <a href="#">
                <i class="bi bi-box-seam-fill"></i>
                Inventory
            </a>

        </div>

        <!-- MAIN CONTENT -->

        <div class="main-content">

            <h1>Products 🌸</h1>

            <p class="subtitle">
                Manage flower products and inventory items.
            </p>

            <!-- PRODUCT GRID -->

            <div class="product-grid">

                <!-- CARD 1 -->

                <div class="product-card">

                    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=800&auto=format&fit=crop"
                    class="product-image">

                    <div class="product-info">

                        <h3>Rose Bouquet</h3>

                        <p>Luxury Roses</p>

                        <h2>$45</h2>

                        <span class="stock">In Stock</span>

                        <div class="product-buttons">

                            <button class="edit-btn">
                                Edit
                            </button>

                            <button class="delete-btn">
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

                <!-- CARD 2 -->

                <div class="product-card">

                    <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?q=80&w=800&auto=format&fit=crop"
                    class="product-image">

                    <div class="product-info">

                        <h3>Tulip Basket</h3>

                        <p>Spring Collection</p>

                        <h2>$32</h2>

                        <span class="stock">In Stock</span>

                        <div class="product-buttons">

                            <button class="edit-btn">
                                Edit
                            </button>

                            <button class="delete-btn">
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

                <!-- CARD 3 -->

                <div class="product-card">

                    <img src="https://images.unsplash.com/photo-1455656678494-4d1b5f3e7ad1?q=80&w=800&auto=format&fit=crop"
                    class="product-image">

                    <div class="product-info">

                        <h3>Sunflower Pack</h3>

                        <p>Fresh Flowers</p>

                        <h2>$28</h2>

                        <span class="low-stock">Low Stock</span>

                        <div class="product-buttons">

                            <button class="edit-btn">
                                Edit
                            </button>

                            <button class="delete-btn">
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
